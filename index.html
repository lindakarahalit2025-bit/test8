<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار تجريبي - التربية الإسلامية - المستوى الثامن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#0e7c66; --c2:#7b3fe4; --c3:#e8590c; --c4:#1c7ed6;
  --ok:#2b9348; --bad:#d62828; --bg:#f4f7fb; --card:#fff; --ink:#1f2937; --muted:#6b7280;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
header{background:linear-gradient(135deg,#0e7c66,#1c7ed6 60%,#7b3fe4);color:#fff;padding:28px 16px 70px;text-align:center}
header h1{margin:0;font-size:1.7rem;font-weight:800}
header p{margin:6px 0 0;opacity:.95}
.wrap{max-width:900px;margin:-50px auto 40px;padding:0 16px}
.panel{background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:18px}
.student{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.student label{font-weight:700}
.student input{flex:1;min-width:200px;padding:10px 14px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:1rem}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.tab{border:none;border-radius:14px;padding:12px 10px;color:#fff;font-family:inherit;font-weight:700;font-size:.98rem;cursor:pointer;opacity:.6;transition:.2s;position:relative}
.tab.active{opacity:1;transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tab .badge{display:block;font-size:.8rem;font-weight:500;opacity:.95}
.lesson-head{border-radius:16px;color:#fff;padding:16px 18px;margin-bottom:14px}
.lesson-head h2{margin:0;font-size:1.3rem}
.lesson-head small{opacity:.95}
.progress{height:10px;background:rgba(255,255,255,.35);border-radius:10px;margin-top:10px;overflow:hidden}
.progress span{display:block;height:100%;background:#fff;width:0;transition:.3s}
.q{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.05);border-right:6px solid var(--accent)}
.q h3{margin:0 0 10px;font-size:1.08rem;font-weight:700}
.q h3 .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:.9rem;margin-left:8px}
.tagq{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:20px;background:#fff3bf;color:#7a5c00;margin-right:6px;vertical-align:middle}
.opts{display:grid;gap:8px}
.opt{text-align:right;border:2px solid #e5e7eb;background:#fafafa;border-radius:12px;padding:10px 14px;font-family:inherit;font-size:1rem;cursor:pointer;transition:.15s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fff}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:#e9f8ee;font-weight:700}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.fb{display:none;margin-top:10px;padding:10px 14px;border-radius:12px;font-size:.95rem}
.fb.show{display:block}
.fb.ok{background:#e9f8ee;color:#1b5e20}
.fb.no{background:#fdecec;color:#8a1c1c}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.btn{border:none;border-radius:14px;padding:12px 22px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;color:#fff}
.btn.main{background:linear-gradient(135deg,#0e7c66,#1c7ed6)}
.btn.alt{background:#6b7280}
.btn.next{background:linear-gradient(135deg,#e8590c,#7b3fe4)}
#result{display:none}
.res-card{text-align:center}
.res-card .big{font-size:3rem;font-weight:800;margin:6px 0;color:var(--c1)}
.stars{font-size:2rem;letter-spacing:4px}
.res-table{width:100%;border-collapse:collapse;margin-top:14px}
.res-table td,.res-table th{padding:10px;border-bottom:1px solid #eee;text-align:center}
.res-table th{background:#f1f5f9}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding-bottom:30px}
@media(max-width:520px){header h1{font-size:1.3rem}.q{padding:14px}}
@media print{.tabs,.actions,header p{display:none}}
</style>
</head>
<body>
<header>
  <h1>🌙 الاختبار التجريبي الإلكتروني – التربية الإسلامية</h1>
  <p>المستوى الثامن • أربعة دروس • 40 سؤالًا (اختيار من متعدد)</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="student">
      <label for="sname">👤 اسم الطالب:</label>
      <input id="sname" placeholder="اكتب اسمك هنا">
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="quiz" style="margin-top:16px"></div>

  <div class="actions" id="actions">
    <button class="btn next" id="nextBtn">الدرس التالي ⬅</button>
    <button class="btn main" id="finishBtn">📊 عرض النتيجة النهائية</button>
  </div>

  <div id="result" class="panel res-card"></div>
</div>

<footer>إعداد المعلمة: ليندا • التربية الإسلامية</footer>

<script>
const LESSONS = [
{
  title:"ثواب المتقين", sub:"سورة الصف (1 – 9) – تفسير", color:"#0e7c66",
  qs:[
   {q:"الكلمة القرآنية التي تدلُّ على (تعظيم الله وتنزيهه عمّا لا يليق به) هي:", t:1, a:"﴿سَبَّحَ﴾", o:["﴿كَبُرَ﴾","﴿زاغوا﴾","﴿مَقْتًا﴾"], e:"سبَّح لله: مجَّده ونزَّهه عمّا لا يليق بجلاله، وكلُّ ما في الكون يسبِّح لله تعالى."},
   {q:"الكلمة القرآنية التي تدلُّ على (البُغض الشديد) هي:", t:1, a:"﴿مَقْتًا﴾", o:["﴿كَبُرَ﴾","﴿نُورَ اللَّهِ﴾","﴿الْفاسِقِينَ﴾"], e:"المقت: البغض الشديد، وفي قوله تعالى: ﴿كَبُرَ مَقْتًا﴾ إشعارٌ بشناعة أن يقول المرء ما لا يفعل."},
   {q:"المقصود بـ (نُورِ اللهِ) في قوله تعالى: ﴿يُرِيدُونَ لِيُطْفِئُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ﴾:", t:1, a:"دينُ الإسلامِ وشريعتُه", o:["ضوءُ الشمس","نورُ القمر","المصابيحُ في المساجد"], e:"نور الله: دينه وشريعته، والله مُتِمُّه ومُظهِره ولو كره الكافرون."},
   {q:"المقصود بـ (الفاسقين) في الآيات الكريمة:", t:1, a:"الخارجون عن طاعةِ الله تعالى", o:["المسافرون","الفقراءُ والمساكين","الصابرون على الأذى"], e:"الفاسقون: الخارجون عن الطاعة، والله لا يهدي القوم الفاسقين."},
   {q:"لماذا عاتب موسى عليه السلام قومَه؟", t:1, a:"لأنهم آذَوْه بأقوالهم وأفعالهم مع علمِهم أنه رسولُ الله إليهم", o:["لأنهم رفضوا الهجرة معه إلى مصر","لأنهم لم يبنوا له بيتًا","لأنهم طلبوا منه أن يدعوَ لهم"], e:"قال تعالى: ﴿لِمَ تُؤْذُونَنِي وَقَدْ تَعْلَمُونَ أَنِّي رَسُولُ اللَّهِ إِلَيْكُمْ﴾."},
   {q:"كيف كانت الضلالةُ عقوبةً لقوم موسى عليه السلام؟", t:1, a:"لمّا مالوا عن الحقِّ باختيارهم، أمال اللهُ قلوبَهم عن قبول الهدى", o:["أضلَّهم اللهُ ابتداءً دون ذنب","أرسل عليهم الطوفانَ فقط","أخرجهم من بلادهم فورًا"], e:"﴿فَلَمَّا زَاغُوا أَزَاغَ اللَّهُ قُلُوبَهُمْ﴾، وهذا من عدل الله؛ فهو لا يُضِلُّ قومًا ابتداءً."},

   {q:"الآية التي تدلُّ على أن دين الله تعالى ظاهرٌ على ما سواه:", t:1, a:"﴿هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ﴾", o:["﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ﴾","﴿وَإِذْ قَالَ مُوسَى لِقَوْمِهِ يَا قَوْمِ لِمَ تُؤْذُونَنِي﴾","﴿كَبُرَ مَقْتًا عِنْدَ اللَّهِ﴾"], e:"الهدى: القرآن الكريم، ودين الحق: الإسلام، والله مُظهِرُه على الأديان كلِّها."},
   {q:"الأنبياء الذين وردت أسماؤهم في الآيات الكريمة هم:", t:1, a:"موسى، وعيسى، ومحمد (أحمد) عليهم الصلاة والسلام", o:["إبراهيم، ونوح، وموسى عليهم السلام","يوسف، ويعقوب، وعيسى عليهم السلام","داود، وسليمان، ومحمد عليهم الصلاة والسلام"], e:"ذُكِر موسى وعيسى عليهما السلام، وبشَّر عيسى برسولٍ يأتي من بعده اسمُه أحمد ﷺ."},
   {q:"من الفوائد التي ترشدنا إليها الآيات الكريمة:", t:1, a:"تحريمُ الكذب وإخلافِ الوعد، ومحبةُ الله للمجاهدين في سبيله صفًّا كالبنيان المرصوص", o:["جوازُ أن يقول المؤمن ما لا يفعل","أن الكون لا يسبِّح لله تعالى","أن الله يُضِلُّ الناس دون سبب"], e:"من الفوائد: الكون يسبِّح الله، تحريم الكذب وإخلاف الوعد، محبة الله للمجاهدين، والله ناصرٌ دينه."}
  ]
},
{
  title:"من خِصال الإيمان", sub:"حديث شريف – شرح وحفظ", color:"#7b3fe4",
  qs:[
   {q:"أكمل الحديث الشريف: «مَنْ كانَ يُؤْمِنُ باللَّهِ والْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ ...»", t:1, a:"لِيَصْمُتْ", o:["لِيَذْهَبْ","لِيَسْتَغْفِرْ","لِيَبْتَسِمْ"], e:"«...فليقلْ خيرًا أو ليصمتْ، ومن كان يؤمن بالله واليوم الآخر فليُكرمْ جارَه، ومن كان يؤمن بالله واليوم الآخر فليُكرمْ ضيفَه» [متفق عليه]."},
   {q:"الخِصال الثلاث التي ذكرها الحديث الشريف هي:", t:1, a:"قولُ الخيرِ أو الصمتُ، وإكرامُ الجار، وإكرامُ الضيف", o:["الصلاةُ والصيامُ والزكاة","برُّ الوالدين وصلةُ الرحمِ والصدقة","الصدقُ والأمانةُ والوفاءُ بالعهد"], e:"تناول الحديث ثلاثة آداب تنظِّم علاقة المسلم بمن حوله."},

   {q:"المقصود بـ «فَلْيَقُلْ خَيْرًا»:", t:1, a:"فليتكلَّمْ بحقٍّ وبكلامٍ حسن", o:["فليُكثِرْ من الكلام في كلِّ شيء","فليرفعْ صوتَه عند الحديث","فليتكلَّمْ عن الناس في غيابهم"], e:"قول الخير: الكلام الحسن الذي فيه طاعة ونفع، وإلّا فالسكوت خير."},

{

   {q:"معنى (المنقول إلينا بالتواتر):", t:1, a:"نقله الجمعُ الكثيرُ عن الجمع الكثير جيلًا بعد جيل حتى وصلنا", o:["نقله شخصٌ واحدٌ فقط","وُجِد مكتوبًا دون أن ينقله أحد","نُقِل إلينا بالترجمة من لغةٍ أخرى"], e:"نقله الجمع الكثير من الصحابة إلى الجمع الكثير من التابعين، وهكذا حتى وصلنا."},
   {q:"من أسماء القرآن الكريم:", t:1, a:"الفُرقان، والكتاب، والذِّكر، والتنزيل", o:["التوراة، والإنجيل، والزبور","الصحيح، والمسند، والسنن","الموطَّأ، والأربعون، والرياض"], e:"قال تعالى: ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾."},
   {q:"يتميَّز القرآن الكريم عن الكتب السماوية السابقة من حيث الحفظ بأنّ:", t:1, a:"اللهَ تعالى تكفَّل بحفظه، بينما أوكل حفظَ الكتب السابقة إلى البشر فحرَّفوها", o:["البشرَ تكفَّلوا بحفظه وحدهم","الكتبَ السابقة لم يدخلها أيُّ تحريف","القرآنَ لا يُحفَظ في الصدور"], e:"قال تعالى: ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾ [الحجر: 9]."},
   {q:"يتميَّز القرآن الكريم عن الكتب السابقة من حيث المستهدَف بأنه:", t:1, a:"رسالةٌ خالدةٌ للناس كافة، بينما نزلت الكتب السابقة لأقوامٍ بأعيانهم", o:["نزل للعرب وحدهم","نزل لأهل مكة فقط","نزل لقومٍ معيَّنين مثل الكتب السابقة"], e:"قال تعالى: ﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِلنَّاسِ بَشِيرًا وَنَذِيرًا﴾ [سبأ: 28]."},
   {q:"الحكمة من حفظ الله تعالى للقرآن الكريم:", t:1, a:"أنه رسالةُ الله الخاتمة إلى البشر، فناسب أن يبقى محفوظًا حتى قيام الساعة", o:["أنه أقصرُ من الكتب السابقة","أن العربَ لا يكتبون","أنه نزل في ليلةٍ واحدة"], e:"القرآن عظيمٌ ومحفوظٌ وباقٍ حتى تقوم الساعة؛ لأنه الرسالة الخاتمة."},
   {q:"من آثار العمل بالقرآن الكريم:", t:1, a:"الهدايةُ والبِشارةُ، والشفاءُ والرحمةُ للفرد والمجتمع", o:["التفرُّقُ والاختلاف","الضعفُ والهوان","كثرةُ الجدال بين الناس"], e:"قال تعالى: ﴿إِنَّ هَذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ﴾، و﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ﴾."},
   {q:"العملُ بالقرآن الكريم والتزامُ حدوده يؤدّي إلى:", t:1, a:"توحيد الفكر وتوحيد الكلمة، ومن ثَمَّ الاتحادُ والقوة ورفعةُ المكانة", o:["كثرة الخلافات بين المسلمين","ضياع مصالح الناس","ترك العمل للدنيا"], e:"القرآن نورٌ للناس، وفي الامتثال لأمره توحيدٌ للفكر والكلمة، ومن ثَمَّ الاتحاد والقوة."},
   {q:"من وجوه إعجاز القرآن الكريم:", t:1, a:"الإعجازُ البيانيُّ (اللغوي)، والإعجازُ العلميُّ، والإخبارُ عن الغيب", o:["طولُ سوره فقط","كثرةُ عدد صفحاته","أنه مكتوبٌ بخطٍّ جميل"], e:"عجز العرب -وهم أهل الفصاحة- عن الإتيان بمثله، وأشار إلى حقائق علمية، وأخبر بأمور غيبية وقعت كما أخبر."}
  ]
},
{
  title:"أحكام المسح على الخُفَّين والجَبيرة", sub:"الفقه الإسلامي", color:"#1c7ed6",
  qs:[
   {q:"تعريف المسح على الخُفَّين:", t:1, a:"إمرارُ اليد المبلَّلة على الخُفَّين وما في حكمهما مثل الجوربين", o:["غسلُ القدمين مع الكعبين","خلعُ الخُفَّين قبل كلِّ صلاة","مسحُ الرأس باليد المبلَّلة"], e:"الخُفّان: ما يُلبَس على الرِّجلين من جلدٍ يستر القدمين والكعبين، والجوربان: ما يُلبَس على هيئة الخفِّ من غير الجلد."},
   {q:"الدليل على مشروعية المسح على الخُفَّين:", t:0, a:"حديث المغيرة بن شعبة: «دَعْهُما؛ فإني أَدْخَلْتُهُما طاهِرَتَيْنِ» فمسح عليهما ﷺ", o:["قوله تعالى: ﴿وَثِيَابَكَ فَطَهِّرْ﴾","حديث: «إنما الأعمال بالنيات»","قوله تعالى: ﴿وَأَقِيمُوا الصَّلَاةَ﴾"], e:"أهوى المغيرة لينزع خُفَّي النبي ﷺ في سفر، فقال: «دعهما فإني أدخلتهما طاهرتين»، فمسح عليهما [متفق عليه]."},
   {q:"مدة المسح على الخُفَّين:", t:1, a:"للمقيم يومٌ وليلة، وللمسافر ثلاثةُ أيامٍ بلياليها", o:["للمقيم ثلاثةُ أيام، وللمسافر يومٌ وليلة","للمقيم والمسافر أسبوعٌ كامل","لا مدةَ له"], e:"المقيم يمسح يومًا وليلة، والمسافر ثلاثة أيام بلياليها."},
   {q:"من شروط المسح على الخُفَّين:", t:1, a:"لبسُهما على طهارة، وطهارةُ الخُفَّين، وسترُهما موضعَ الوضوء (القدمين والكعبين)", o:["أن يكونا جديدين","أن يكونا من لونٍ واحد","أن يلبسهما بعد الحدث مباشرة"], e:"فلو لبسهما على غير وضوء لم يصحَّ المسح عليهما للصلاة، ولا يصحُّ المسح إذا كانا نجسين."},
   {q:"مثالٌ واقعيٌّ يتحقَّق فيه أحدُ نواقض المسح على الخُفَّين:", t:1, a:"مسافرٌ مسح على خُفَّيه ثم انتهت ثلاثةُ أيامٍ بلياليها", o:["مقيمٌ مسح على خُفَّيه بعد ساعتين من لبسهما","شخصٌ لبس خُفَّيه على وضوء","مسافرٌ مسح على خُفَّيه في اليوم الثاني"], e:"من النواقض: انتهاء المدة، ونزع الخفين أو أحدهما، وحدوث حدثٍ أكبر يوجب الغسل."},
   {q:"صفة المسح على الخُفَّين:", t:1, a:"يبلِّل يديه بالماء، ثم يمسح باليمنى ظاهرَ القدم اليمنى، وباليسرى ظاهرَ القدم اليسرى", o:["يمسح أسفلَ القدمين فقط","يغسل القدمين فوق الخُفَّين","يمسح القدم اليسرى قبل اليمنى بيدٍ واحدة"], e:"المسح يكون على ظاهر الخفِّ، لا على أسفله."},
   {q:"مفهوم الجَبيرة:", t:1, a:"ما يُوضَع على العضو المصاب حتى يلتئم، مثل الجبس والرباط الضاغط", o:["ما يُلبَس على الرِّجلين من الجلد","ما يُغطّى به الرأس في الصلاة","نوعٌ من أنواع النجاسات"], e:"الجبيرة: كلُّ ما يوضع على العضو المصاب كالجبس والأقمشة الطبية والرباط الضاغط."},
   {q:"شرطا المسح على الجَبيرة:", t:1, a:"أن يكون في إزالتها حرجٌ، وألّا تتجاوز موضعَ الحاجة", o:["أن تُوضَع على طهارة، وأن تكون جديدة","أن يمسح عليها يومًا وليلة فقط","أن تكون على القدمين فقط"], e:"إذا أمكن إزالتها للوضوء وإعادتها دون ضرر فلا يمسح عليها، ولا يُشترط وضعها على طهارة."},
   {q:"صفة المسح على الجَبيرة:", t:1, a:"يبلِّل يده ثم يمرِّرها على الجَبيرة، مستوعِبًا جميعَ جهاتها بالمسح", o:["يمسح جزءًا صغيرًا منها فقط","يمسح ظاهرها مرةً واحدة","يغسلها بالماء الكثير"], e:"تُستوعَب الجبيرة بالمسح من جميع جهاتها."},
   {q:"قارن: من الفروق بين المسح على الخُفَّين والمسح على الجَبيرة:", t:1, a:"الخُفّان يُشترَط لبسُهما على طهارة ولهما مدةٌ محدَّدة، أمّا الجَبيرة فلا تُشترَط لها الطهارة ويمسح عليها حتى تُزال", o:["كلاهما يُشترَط له مدةُ يومٍ وليلة","الجَبيرة تُشترَط لها الطهارة والخُفّان لا","لا فرق بينهما أبدًا"], e:"ومن عجز عن الغسل والمسح معًا تيمَّم عمّا عجز عنه، كمن حُرِقت يده ولم يستطع وضع جبيرة."}
  ]
}
];

const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const state = LESSONS.map(L => L.qs.map(q => ({opts: shuffle([q.a,...q.o]), chosen:null})));
let current = 0;

function score(li){ return state[li].filter((s,i)=>s.chosen===LESSONS[li].qs[i].a).length; }
function answered(li){ return state[li].filter(s=>s.chosen!==null).length; }

function renderTabs(){
  const t = document.getElementById('tabs'); t.innerHTML='';
  LESSONS.forEach((L,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===current?' active':''); b.style.background=L.color;
    b.innerHTML=`${i+1}. ${L.title}<span class="badge">أُجيب ${answered(i)} من 10 • الدرجة ${score(i)}</span>`;
    b.onclick=()=>{current=i;render();window.scrollTo({top:0,behavior:'smooth'});};
    t.appendChild(b);
  });
}

function render(){
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderTabs();
  const L=LESSONS[current], box=document.getElementById('quiz');
  box.style.setProperty('--accent',L.color);
  let h=`<div class="lesson-head" style="background:linear-gradient(135deg,${L.color},#222b)">
    <h2>📘 ${L.title}</h2><small>${L.sub}</small>
    <div class="progress"><span style="width:${answered(current)*10}%"></span></div></div>`;
  L.qs.forEach((q,qi)=>{
    const s=state[current][qi];
    h+=`<div class="q"><h3><span class="num">${qi+1}</span>${q.q}${q.t?'<span class="tagq">من التقويم</span>':''}</h3><div class="opts">`;
    s.opts.forEach((o,oi)=>{
      let cls='opt';
      if(s.chosen!==null){ if(o===q.a) cls+=' correct'; else if(o===s.chosen) cls+=' wrong'; }
      h+=`<button class="${cls}" ${s.chosen!==null?'disabled':''} onclick="choose(${qi},${oi})">${'أبجد'[oi]}) ${o}</button>`;
    });
    h+=`</div>`;
    if(s.chosen!==null){
      const ok=s.chosen===q.a;
      h+=`<div class="fb show ${ok?'ok':'no'}">${ok?'✅ أحسنت! إجابة صحيحة.':'❌ الإجابة الصحيحة: '+q.a+'.'}<br>💡 ${q.e}</div>`;
    }
    h+=`</div>`;
  });
  box.innerHTML=h;
  document.getElementById('nextBtn').style.display = current<LESSONS.length-1?'inline-block':'none';
}

function choose(qi,oi){
  const s=state[current][qi]; if(s.chosen!==null) return;
  s.chosen=s.opts[oi]; 
  const y=window.scrollY; render(); window.scrollTo(0,y);
}

document.getElementById('nextBtn').onclick=()=>{ if(current<LESSONS.length-1){current++;render();window.scrollTo({top:0,behavior:'smooth'});} };

document.getElementById('finishBtn').onclick=()=>{
  const total=LESSONS.reduce((s,_,i)=>s+score(i),0);
  const ans=LESSONS.reduce((s,_,i)=>s+answered(i),0);
  const pct=Math.round(total/40*100);
  const name=document.getElementById('sname').value.trim()||'الطالب';
  const stars=pct>=90?'⭐⭐⭐⭐⭐':pct>=75?'⭐⭐⭐⭐':pct>=60?'⭐⭐⭐':pct>=40?'⭐⭐':'⭐';
  const msg=pct>=90?'ممتاز! بارك الله فيك 🌟':pct>=75?'جيد جدًا، استمر 👏':pct>=60?'جيد، راجع الأسئلة الخاطئة 📖':'تحتاج إلى مراجعة الدروس مرة أخرى 💪';
  let rows=LESSONS.map((L,i)=>`<tr><td style="color:${L.color};font-weight:700">${L.title}</td><td>${score(i)} / 10</td></tr>`).join('');
  const r=document.getElementById('result');
  r.innerHTML=`<h2>🎉 نتيجة ${name}</h2><div class="stars">${stars}</div>
    <div class="big">${total} / 40</div><p><b>${pct}%</b> • ${msg}</p>
    ${ans<40?`<p style="color:#d62828">تنبيه: لم تُجب عن ${40-ans} سؤالًا.</p>`:''}
    <table class="res-table"><tr><th>الدرس</th><th>الدرجة</th></tr>${rows}</table>
    <div class="actions"><button class="btn alt" onclick="render()">↩ العودة للأسئلة</button>
    <button class="btn main" onclick="resetAll()">🔄 إعادة الاختبار</button>
    <button class="btn next" onclick="window.print()">🖨 طباعة النتيجة</button></div>`;
  document.getElementById('quiz').style.display='none';
  r.style.display='block'; renderTabs(); window.scrollTo({top:0,behavior:'smooth'});
};

function resetAll(){
  state.forEach((ls,li)=>ls.forEach((s,qi)=>{s.chosen=null;s.opts=shuffle([LESSONS[li].qs[qi].a,...LESSONS[li].qs[qi].o]);}));
  current=0; render(); window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
